<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>SalesTrack</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SalesTrack" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-zinc-100 dark:bg-zinc-950 min-h-screen transition-colors duration-500 text-zinc-800 dark:text-zinc-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        // If in preview iframe, clear any old service workers to avoid stale cache blocking
        if (window.self !== window.top) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (const r of registrations) {
              r.unregister().catch(() => {});
            }
          }).catch(() => {});
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => {
                // Ensure update is checked
                reg.update().catch(() => {});
              })
              .catch(err => {
                console.log('Service Worker registration note:', err);
              });
          });
        }
      }
    </script>
  </body>
</html>
